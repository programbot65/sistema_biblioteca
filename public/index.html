<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca UEEA · Biblioteca digital</title>
  <meta name="description" content="Plataforma digital de la Biblioteca UEEA: catálogo, préstamos, devoluciones y administración.">
  <meta name="color-scheme" content="dark light">
  <script>
    try {
      document.documentElement.dataset.tema = localStorage.getItem('biblio_tema') || 'oscuro';
    } catch (error) {
      document.documentElement.dataset.tema = 'oscuro';
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2348E5FF'/%3E%3Cstop offset='1' stop-color='%23F472D0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23080B18'/%3E%3Cpath d='M32 14c-4.5-3-10-4-16-4v36c6 0 11.5 1 16 4 4.5-3 10-4 16-4V10c-6 0-11.5 1-16 4zm0 0v36' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/estanteria.css">
  <link rel="stylesheet" href="/css/biblioteca.css">
  <link rel="stylesheet" href="/css/tema-claro.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

  <div class="app">
    <!-- ============ Columna principal ============ -->
    <div class="app__principal">
      <header class="encabezado">
        <div class="encabezado__marca">
          <span class="encabezado__logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="28" height="28" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M32 14c-4.5-3-10-4-16-4v36c6 0 11.5 1 16 4 4.5-3 10-4 16-4V10c-6 0-11.5 1-16 4zm0 0v36" stroke="#48E5FF" stroke-width="4"></path>
            </svg>
          </span>
          <div class="encabezado__textos">
            <h1 class="encabezado__titulo">Biblioteca UEEA</h1>
            <p class="encabezado__subtitulo" id="subtitulo-seccion">Catálogo digital y control de préstamos</p>
          </div>
        </div>

        <form class="encabezado__buscador" id="busqueda-global" role="search" aria-label="Búsqueda rápida en el catálogo">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.4" y1="15.4" x2="20.5" y2="20.5"></line></svg>
          <input type="search" id="busqueda-global-entrada" placeholder="Buscar libros, autores, categorías…" aria-label="Búsqueda rápida en el catálogo" autocomplete="off">
        </form>

        <div class="encabezado__estado">
          <span class="rol" id="rol-usuario">
            <span class="rol__icono" aria-hidden="true"></span>
            <span class="rol__texto">Encargado</span>
          </span>
          <span class="estado" id="estado-sistema" hidden>
            <span class="estado__punto" aria-hidden="true"></span>
            <span class="estado__texto" id="estado-texto">En línea</span>
          </span>
          <button type="button" class="tema-boton" id="tema-boton" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
            <svg class="tema-boton__sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"></path></svg>
            <svg class="tema-boton__luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg>
          </button>
          <a class="icono-boton" id="boton-avisos" href="#/prestamos?situacion=atrasado" hidden>
            <span class="icono-boton__glifo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
            </span>
            <span class="icono-boton__globo" id="contador-avisos" aria-hidden="true"></span>
            <span class="oculto">Ver préstamos atrasados</span>
          </a>
          <a href="#/inicio" class="volver-estanteria" id="volver-estanteria">
            <span class="volver-estanteria__libro" aria-hidden="true">
              <span class="volver-estanteria__lomo"></span>
              <span class="volver-estanteria__tapa"></span>
            </span>
            <span class="volver-estanteria__texto">Estantería</span>
          </a>
        </div>
      </header>

      <main class="contenido" id="contenido" tabindex="-1">
        <p class="cargando" role="status">Cargando información…</p>
      </main>

      <footer class="pie">
        <p>Biblioteca UEEA · Sistema de gestión bibliográfica · Proyecto académico</p>
      </footer>
    </div>
  </div>

  <!-- ============ Ventana modal ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal__fondo" data-cerrar-modal></div>
    <div class="modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal__cabecera">
        <h2 class="modal__titulo" id="modal-titulo">Detalle</h2>
        <button type="button" class="modal__cerrar" data-cerrar-modal aria-label="Cerrar ventana">&times;</button>
      </header>
      <div class="modal__cuerpo" id="modal-cuerpo"></div>
    </div>
  </div>

  <div class="avisos" id="avisos" aria-live="polite" aria-atomic="true"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/iconos.js"></script>
  <script src="/js/piezas.js"></script>
  <script src="/js/vistas.js"></script>
  <script src="/js/navegacion.js"></script>
  <script src="/js/vistas/portada.js"></script>
  <script src="/js/vistas/panel.js"></script>
  <script src="/js/vistas/catalogo.js"></script>
  <script src="/js/vistas/prestamos.js"></script>
  <script src="/js/vistas/gestion.js"></script>
  <script src="/js/vistas/categorias.js"></script>
  <script src="/js/vistas/usuarios.js"></script>
  <script src="/js/vistas/reportes.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
